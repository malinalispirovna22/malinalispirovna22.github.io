<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Polaroid Generator</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f3f3;
  padding:40px;
}

.container{
  max-width:1200px;
  margin:auto;
}

.panel{
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

h1{
  margin-bottom:10px;
}

p{
  color:#777;
  margin-bottom:25px;
}

.controls{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.btn{
  padding:14px 24px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-size:16px;
}

.upload-btn{
  background:#111;
  color:white;
}

.generate-btn{
  background:white;
  border:1px solid #ccc;
}

input{
  display:none;
}

.layouts{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(400px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  padding:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

.card img{
  width:100%;
  display:block;
  border-radius:10px;
  border:1px solid #ddd;
}

.card button{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#111;
  color:white;
  cursor:pointer;
}

.info{
  margin-top:20px;
  color:#999;
  font-size:14px;
}

</style>

</head>

<body>

<div class="container">

  <div class="panel">

    <h1>Polaroid Generator</h1>

    <p>
      template.png должен лежать рядом с index.html
    </p>

    <div class="controls">

      <label class="btn upload-btn">

        Загрузить фото

        <input
          type="file"
          id="upload"
          multiple
          accept="image/*"
        >

      </label>

      <button
        class="btn generate-btn"
        id="generate"
      >
        Сгенерировать макеты
      </button>

    </div>

    <div class="info">
      В template.png окна под фото должны быть прозрачными
    </div>

  </div>

  <div
    class="layouts"
    id="layouts"
  ></div>

</div>

<script>

const upload = document.getElementById('upload');
const generate = document.getElementById('generate');
const layouts = document.getElementById('layouts');

let uploadedFiles = [];

upload.addEventListener('change',(e)=>{

  uploadedFiles = Array.from(e.target.files);

  alert(
    'Загружено фото: ' +
    uploadedFiles.length
  );

});

function loadImage(src){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = ()=>{
      resolve(img);
    };

    img.onerror = ()=>{
      reject(
        'Ошибка загрузки изображения: ' + src
      );
    };

    img.src = src;

  });

}

function fileToDataURL(file){

  return new Promise(resolve=>{

    const reader = new FileReader();

    reader.onload = ()=>{
      resolve(reader.result);
    };

    reader.readAsDataURL(file);

  });

}

//
// COVER FUNCTION
// масштаб по минимальной стороне
// лишнее обрезается
//

function drawImageCover(
  ctx,
  img,
  x,
  y,
  frameWidth,
  frameHeight
){

  const imageRatio =
    img.width / img.height;

  const frameRatio =
    frameWidth / frameHeight;

  let drawWidth;
  let drawHeight;

  if(imageRatio > frameRatio){

    // фото шире рамки
    drawHeight = frameHeight;
    drawWidth = drawHeight * imageRatio;

  }else{

    // фото выше рамки
    drawWidth = frameWidth;
    drawHeight = drawWidth / imageRatio;

  }

  const drawX =
    x + (frameWidth - drawWidth) / 2;

  const drawY =
    y + (frameHeight - drawHeight) / 2;

  ctx.drawImage(
    img,
    drawX,
    drawY,
    drawWidth,
    drawHeight
  );

}

generate.addEventListener('click', async ()=>{

  try{

    if(!uploadedFiles.length){

      alert('Сначала загрузите фото');

      return;
    }

    layouts.innerHTML = '';

    //
    // TEMPLATE PNG
    //

    const template = await loadImage(
      'template.png'
    );

    const WIDTH = template.width;
    const HEIGHT = template.height;

    //
    // FILES -> DATAURL
    //

    let images = await Promise.all(

      uploadedFiles.map(file=>{

        return fileToDataURL(file);

      })

    );

    //
    // НЕЧЕТНОЕ КОЛИЧЕСТВО
    //

    if(images.length % 2 !== 0){

      images.push(
        images[images.length - 1]
      );

    }

    //
    // КООРДИНАТЫ КАДРОВ
    // НАСТРОЙТЕ ПОД PSD
    //

    const LEFT_FRAME = {

      x:160,
      y:140,

      width:420,
      height:540

    };

    const RIGHT_FRAME = {

      x:920,
      y:140,

      width:420,
      height:540

    };

    //
    // ГЕНЕРАЦИЯ
    //

    for(let i=0;i<images.length;i+=2){

      const canvas =
        document.createElement('canvas');

      canvas.width = WIDTH;
      canvas.height = HEIGHT;

      const ctx =
        canvas.getContext('2d');

      //
      // БЕЛЫЙ ФОН
      //

      ctx.fillStyle = '#fff';

      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );

      //
      // ЗАГРУЗКА ФОТО
      //

      const leftImage =
        await loadImage(images[i]);

      const rightImage =
        await loadImage(images[i+1]);

      //
      // ЛЕВОЕ ФОТО
      //

      drawImageCover(
        ctx,
        leftImage,

        LEFT_FRAME.x,
        LEFT_FRAME.y,

        LEFT_FRAME.width,
        LEFT_FRAME.height
      );

      //
      // ПРАВОЕ ФОТО
      //

      drawImageCover(
        ctx,
        rightImage,

        RIGHT_FRAME.x,
        RIGHT_FRAME.y,

        RIGHT_FRAME.width,
        RIGHT_FRAME.height
      );

      //
      // PSD PNG ПОВЕРХ
      //

      ctx.drawImage(
        template,
        0,
        0,
        WIDTH,
        HEIGHT
      );

      //
      // JPG
      //

      const jpg = canvas.toDataURL(
        'image/jpeg',
        1
      );

      //
      // КАРТОЧКА
      //

      const card =
        document.createElement('div');

      card.className = 'card';

      //
      // PREVIEW
      //

      const preview =
        document.createElement('img');

      preview.src = jpg;

      //
      // DOWNLOAD BUTTON
      //

      const downloadButton =
        document.createElement('button');

      downloadButton.innerText =
        'Скачать JPG';

      downloadButton.addEventListener(
        'click',
        ()=>{

          const link =
            document.createElement('a');

          link.href = jpg;

          link.download =
            `layout-${i/2+1}.jpg`;

          link.click();

        }
      );

      //
      // APPEND
      //

      card.appendChild(preview);

      card.appendChild(downloadButton);

      layouts.appendChild(card);

    }

    alert('Макеты готовы');

  }catch(error){

    console.error(error);

    alert(error);

  }

});

</script>

</body>
</html>
